---
name: Build and Publish Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gemstone-s

jobs:
  build_and_publish:
    name: Build and publish GemStone/S ${{ matrix.version }}
    permissions:
      # for actions/checkout to fetch code
      contents: read
      # for codeql-action to upload SARIF results
      security-events: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # GS_ARCH and GS_MAJOR_VERSION are derived from the version by
        # local-build.sh; they are spelled out here rather than reproducing
        # that arithmetic in YAML.
        include:
          - version: '6.7.2.1'
            arch: 'x86_64'
            major: '67'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Gather docker meta data
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Every tag carries the GemStone version, so that matrix entries
          # publishing to the same image cannot overwrite each other.
          tags: |
            type=raw,value=${{ matrix.version }}
            type=ref,event=branch,prefix=${{ matrix.version }}-
            type=ref,event=pr,prefix=${{ matrix.version }}-pr-
            type=sha,prefix=${{ matrix.version }}-
          flavor: |
            latest=false

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            GS_ARCH=${{ matrix.arch }}
            GS_MAJOR_VERSION=${{ matrix.major }}
            GS_VERSION=${{ matrix.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=gemstone-s-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=gemstone-s-${{ matrix.version }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ env.IMAGE }}:${{ matrix.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: github.event_name != 'pull_request'
        with:
          sarif_file: 'trivy-results.sarif'
          # Required: without it matrix entries overwrite each other's results
          category: gemstone-s-${{ matrix.version }}
