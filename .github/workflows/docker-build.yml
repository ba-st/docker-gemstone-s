---
name: Build and Publish Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gemstone-s

jobs:
  build_and_publish:
    name: Build and publish GemStone/S ${{ matrix.version }}
    permissions:
      # for actions/checkout to fetch code
      contents: read
      # for codeql-action to upload SARIF results
      security-events: write
    runs-on: ubuntu-latest

    strategy:
      # 6.6.5 and 6.7.2.1 are independent deliverables, not shards of one build:
      # a failure in either must not cancel the other.
      fail-fast: false
      matrix:
        include:
          # 6.7.2.1 is the default version this repository publishes.
          - version: '6.7.2.1'
            arch: 'x86_64'
            major: '67'
          # 6.6.5 is the last version known to work with our code, published so a
          # rollback of the 6.7.x upgrade is a tag change rather than a rebuild.
          # It ships only the i686 distribution; there is no x86_64 Linux build.
          - version: '6.6.5'
            arch: 'i686'
            major: '66'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Gather docker meta data
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # "latest=auto" (the default) appends a bare "latest" on a semver git tag.
          # That tag carries no version suffix, so both matrix legs would publish it
          # and race. This project does not bless a "latest" either, so: off.
          flavor: latest=false
          # Every tag derived from the git ref is identical across matrix legs, so
          # each one needs a per-version suffix or the legs overwrite each other's
          # tags. The plain version tag is already unique per leg and stays bare;
          # it is only published from the default branch, so that a build from a
          # topic branch cannot overwrite it.
          tags: |
            type=raw,value=${{ matrix.version }},enable={{is_default_branch}}
            type=ref,event=branch,suffix=-${{ matrix.version }}
            type=ref,event=pr,suffix=-${{ matrix.version }}
            type=semver,pattern={{version}},suffix=-${{ matrix.version }}
            type=sha,suffix=-${{ matrix.version }}

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            GS_ARCH=${{ matrix.arch }}
            GS_MAJOR_VERSION=${{ matrix.major }}
            GS_VERSION=${{ matrix.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          # The gha cache scope defaults to the literal "buildkit" for every build,
          # so without a per-version scope each leg would evict the other's cache.
          # This caches the shared base stage once per version, which is the price
          # of both legs actually hitting their cache.
          cache-from: type=gha,scope=${{ matrix.version }}
          cache-to: type=gha,scope=${{ matrix.version }},mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.docker_meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: github.event_name != 'pull_request'
        with:
          sarif_file: 'trivy-results.sarif'
          # Required: uploading more than one SARIF file from the same tool in one
          # workflow overwrites the earlier results unless each has its own
          # category. The automatic matrix-derived category only applies to
          # codeql-action/analyze, not to third-party uploads.
          category: trivy-gemstone-${{ matrix.version }}
