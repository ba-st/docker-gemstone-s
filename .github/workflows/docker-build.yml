---
name: Build and Publish Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gemstone-s
  # The GemStone/S version this repository publishes. GS_ARCH and
  # GS_MAJOR_VERSION follow from it, the same way local-build.sh derives them.
  GS_VERSION: '6.7.2.1'
  GS_ARCH: 'x86_64'
  GS_MAJOR_VERSION: '67'

jobs:
  build_and_publish:
    name: Build and publish Docker images
    permissions:
      # for actions/checkout to fetch code
      contents: read
      # for codeql-action to upload SARIF results
      security-events: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Gather docker meta data
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # The plain version tag is only published from the default branch,
          # so that a build from a topic branch cannot overwrite it.
          tags: |
            type=raw,value=${{ env.GS_VERSION }},enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Docker build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            GS_ARCH=${{ env.GS_ARCH }}
            GS_MAJOR_VERSION=${{ env.GS_MAJOR_VERSION }}
            GS_VERSION=${{ env.GS_VERSION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.docker_meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: github.event_name != 'pull_request'
        with:
          sarif_file: 'trivy-results.sarif'
